name: MinMusic Android release

# Builds a signed release APK and publishes it as a GitHub Release.
# The in-app updater reads releases from this repository and prefers the asset named MinMusic.apk.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (for example v1.2.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: minmusic-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}"
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must look like vX.Y.Z"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check for ad and tracking SDKs
        run: bash scripts/check_no_ads.sh

      - name: Check tag matches appVersion
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^appVersion *= *\(.*\)$/\1/p' gradle.properties | tr -d '[:space:]')
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match appVersion=$version in gradle.properties"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          ndk=$(sed -n 's/^androidNdk *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "ndk;$ndk" > /dev/null

      - name: Decode keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/minmusic-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :androidApp:assembleRelease

      - name: Verify signature and collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          test -f "$apk" || { echo "::error::$apk was not produced (is the release build signed?)"; exit 1; }
          apksigners=("$ANDROID_HOME"/build-tools/*/apksigner)
          "${apksigners[-1]}" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/MinMusic.apk
          cp androidApp/build/outputs/mapping/release/mapping.txt dist/MinMusic-mapping.txt || true
          (cd dist && sha256sum MinMusic.apk > MinMusic.apk.sha256)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MinMusic ${RELEASE_TAG#v}" \
              --generate-notes
          fi

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/minmusic-release.jks"
